<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) - Explicit Consent -->
    <script src="/gtm.js" defer></script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="author" content="Dhruba Datta" />
    <meta
      name="keywords"
      content="ai engineer, product lead, full-stack developer, voice ai, llm automation, n8n, supabase, next.js, dhruba datta"
    />

    <!--
      Home-page defaults. Tags marked data-default are replaced per route:
      by the pre-render script at build time and by <Seo> on the client.
    -->
    <title data-default>Dhruba Datta | Portfolio</title>
    <meta data-default name="description" content="Dhruba Datta, R&amp;D Lead at Social Engagement Group and Product &amp; Operations Lead at Optify. Builds production voice AI, LLM automation and full-stack platforms for real businesses." />
    <link data-default rel="canonical" href="https://dhruba-datta.netlify.app/" />

    <!-- Open Graph / Facebook -->
    <meta data-default property="og:type" content="website" />
    <meta data-default property="og:url" content="https://dhruba-datta.netlify.app/" />
    <meta data-default property="og:title" content="Dhruba Datta | Portfolio" />
    <meta data-default property="og:description" content="Dhruba Datta, R&amp;D Lead at Social Engagement Group and Product &amp; Operations Lead at Optify. Builds production voice AI, LLM automation and full-stack platforms for real businesses." />
    <meta data-default property="og:image" content="https://dhruba-datta.netlify.app/images/Headshot.webp" />

    <!-- Twitter -->
    <meta data-default name="twitter:card" content="summary_large_image" />
    <meta data-default name="twitter:url" content="https://dhruba-datta.netlify.app/" />
    <meta data-default name="twitter:title" content="Dhruba Datta | Portfolio" />
    <meta data-default name="twitter:description" content="Dhruba Datta, R&amp;D Lead at Social Engagement Group and Product &amp; Operations Lead at Optify. Builds production voice AI, LLM automation and full-stack platforms for real businesses." />
    <meta data-default name="twitter:image" content="https://dhruba-datta.netlify.app/images/Headshot.webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Dhruba Datta",
        "url": "https://dhruba-datta.netlify.app/",
        "image": "https://dhruba-datta.netlify.app/images/Headshot.webp",
        "jobTitle": "Research & Development Lead",
        "worksFor": [
          { "@type": "Organization", "name": "Social Engagement Group" },
          { "@type": "Organization", "name": "Optify Transformation Partners" }
        ],
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Delhi Technological University" },
        "knowsAbout": ["Voice AI", "Large Language Models", "AI for Software Engineering", "Full-Stack Development", "Workflow Automation", "Product Management"],
        "sameAs": [
          "https://www.linkedin.com/in/dhruba-datta/",
          "https://github.com/dhruba-datta",
          "https://scholar.google.co.uk/citations?user=RGxdIVkAAAAJ",
          "https://leetcode.com/u/dhruba-datta/"
        ]
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/images/Headshot.webp" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
